name: Build Shpora IPA

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS & watchOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Newest Xcode Version
        run: |
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selected Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Locate Xcode Project
        id: locate-proj
        run: |
          if [ -d "Shpora.xcodeproj" ]; then
            echo "project_path=Shpora.xcodeproj" >> $GITHUB_OUTPUT
            echo "work_dir=." >> $GITHUB_OUTPUT
          elif [ -d "Shpora/Shpora.xcodeproj" ]; then
            echo "project_path=Shpora/Shpora.xcodeproj" >> $GITHUB_OUTPUT
            echo "work_dir=Shpora" >> $GITHUB_OUTPUT
          else
            echo "Error: Shpora.xcodeproj not found!"
            exit 1
          fi

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${{ steps.locate-proj.outputs.project_path }}" \
            -clonedSourcePackagesDirPath ./DerivedData/SourcePackages

      - name: Build iOS Application
        run: |
          xcodebuild build \
            -project "${{ steps.locate-proj.outputs.project_path }}" \
            -scheme "Shpora" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Build watchOS Companion App
        run: |
          xcodebuild build \
            -project "${{ steps.locate-proj.outputs.project_path }}" \
            -scheme "Shpora Watch App" \
            -configuration Release \
            -destination "generic/platform=watchOS" \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA with Watch App
        run: |
          mkdir -p build_output/Payload
          
          APP_PATH=$(find ./DerivedData/Build/Products -name "Shpora.app" -type d | head -n 1)
          WATCH_APP_PATH=$(find ./DerivedData/Build/Products -name "Shpora Watch App.app" -type d | head -n 1)
          
          echo "Found iOS App: $APP_PATH"
          echo "Found Watch App: $WATCH_APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Shpora.app not found in DerivedData!"
            exit 1
          fi
          
          cp -R "$APP_PATH" build_output/Payload/
          
          # Embed Watch App inside Shpora.app/Watch/
          if [ -n "$WATCH_APP_PATH" ]; then
            echo "Embedding Watch app into Payload/Shpora.app/Watch/..."
            mkdir -p "build_output/Payload/Shpora.app/Watch"
            rm -rf "build_output/Payload/Shpora.app/Watch/Shpora Watch App.app"
            cp -R "$WATCH_APP_PATH" "build_output/Payload/Shpora.app/Watch/"
          fi
          
          cd build_output
          zip -r -y ../Shpora.ipa Payload
          cd ..
          
          echo "=== IPA Content Summary ==="
          unzip -l Shpora.ipa | head -n 30
          ls -lh Shpora.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shpora-IPA
          path: Shpora.ipa
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Shpora.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
